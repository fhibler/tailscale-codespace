name: Test Devcontainer Feature

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dev Container CLI
        run: |
          npm install -g @devcontainers/cli@0.90.0

      - name: Run tests
        run: |
          devcontainer features test --base-image ubuntu:latest
